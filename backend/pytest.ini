[pytest]
testpaths = tests
pythonpath = . ..
filterwarnings =
    # Filter upstream Starlette/FastAPI TestClient httpx deprecation warning
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning
    # Filter FastAPI on_event deprecation warning during testclient initialization
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
